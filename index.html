<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatt Elite V12</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #007aff; --bg: #ffffff; --txt: #000; --card: #f2f2f7; --hdr: #ffffff; }
        [data-theme="dark"] { --bg: #000000; --txt: #ffffff; --card: #1c1c1e; --hdr: #121212; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--txt); overflow: hidden; }

        /* الشاشات */
        .scr { display: none; height: 100%; width: 100%; flex-direction: column; background: var(--bg); position: absolute; }
        .active { display: flex; }

        /* الهيدر الفخم */
        .hdr { height: 60px; border-bottom: 1px solid rgba(128,128,128,0.2); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; flex-shrink: 0; background: var(--hdr); }
        .hdr b { font-size: 19px; font-weight: 800; color: var(--txt); }

        /* منطقة الدردشة - ثابتة بالوضع الأفقي */
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background-size: cover; }
        .bubble { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 15px; position: relative; cursor: pointer; }
        .me { align-self: flex-end; background: var(--p); color: #fff; border-bottom-right-radius: 4px; }
        .them { align-self: flex-start; background: var(--card); color: var(--txt); border-bottom-left-radius: 4px; }

        /* صندوق الإرسال الثابت 100% */
        .bar { height: 65px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(128,128,128,0.2); background: var(--hdr); flex-shrink: 0; }
        .input-wrap { flex: 1; background: var(--card); border-radius: 20px; padding: 5px 15px; display: flex; align-items: center; }
        .input-wrap input { flex: 1; border: none; background: transparent; color: var(--txt); padding: 8px; outline: none; font-size: 16px; }

        /* واجهات البروفايل والإعدادات */
        .panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; flex-direction: column; }
        .panel.active { display: flex; }

        /* سلايدر الصور الـ 7 */
        .slider { width: 100%; height: 350px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #000; }
        .slider img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; scroll-snap-align: center; }

        /* أزرار الحذف والخيارات */
        .sheet { position: fixed; bottom: -100%; width: 100%; background: var(--hdr); padding: 20px; border-radius: 25px 25px 0 0; transition: 0.3s; z-index: 2000; }
        .sheet.open { bottom: 0; }
        .btn-opt { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 12px; background: var(--card); color: var(--txt); font-weight: 600; }

        .overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1500; }
    </style>
</head>
<body data-theme="light">

    <div id="overlay" class="overlay" onclick="closePopups()"></div>

    <div id="msg-sheet" class="sheet">
        <button class="btn-opt" onclick="copyMsg()">نسخ الرسالة</button>
        <button class="btn-opt" onclick="delForMe()">حذف مني</button>
        <button class="btn-opt" style="color:red;" onclick="delForAll()">حذف من الجميع 🗑️</button>
        <button class="btn-opt" onclick="closePopups()">إلغاء</button>
    </div>

    <div id="scr-login" class="scr active" style="justify-content:center; align-items:center;">
        <div style="width:80%; text-align:center;">
            <h1 style="font-size:45px; margin-bottom:40px;">Chatt</h1>
            <input type="text" id="reg-name" placeholder="الاسم الكامل" style="width:100%; padding:15px; margin-bottom:15px; border-radius:15px; border:1px solid #ddd;">
            <input type="text" id="reg-user" placeholder="اسم المستخدم" style="width:100%; padding:15px; margin-bottom:25px; border-radius:15px; border:1px solid #ddd;">
            <button onclick="login()" style="width:100%; padding:15px; background:var(--p); color:#fff; border:none; border-radius:15px; font-weight:bold;">دخول</button>
        </div>
    </div>

    <div id="scr-main" class="scr">
        <div class="hdr">
            <button onclick="showPanel('settings-panel')" style="background:none; border:none; font-size:22px;">⚙️</button>
            <b>محادثاتي</b>
            <button onclick="showPanel('new-chat-panel')" style="background:none; border:none; font-size:22px;">➕</button>
        </div>
        <div id="inbox" style="flex:1; overflow-y:auto; padding:10px;"></div>
    </div>

    <div id="scr-chat" class="scr">
        <div class="hdr">
            <button onclick="goHome()" style="background:none; border:none; font-size:20px;">🔙</button>
            <div onclick="showFriendProfile()" style="text-align:center; cursor:pointer;">
                <b id="chat-user-name">...</b>
                <div style="font-size:10px; color:#34c759;">متصل الآن</div>
            </div>
            <div id="chat-avatar" style="width:35px; height:35px; border-radius:50%; background:#ccc;"></div>
        </div>
        <div id="chat-flow"></div>
        <div class="bar">
            <button onclick="showPanel('media-panel')" style="background:none; border:none; font-size:22px;">📎</button>
            <div class="input-wrap">
                <input type="text" id="msg-in" placeholder="اكتب رسالة...">
            </div>
            <button onclick="send()" style="background:var(--p); color:#fff; border:none; width:40px; height:40px; border-radius:50%; font-weight:bold;">➤</button>
        </div>
    </div>

    <div id="settings-panel" class="panel">
        <div class="hdr"><button onclick="closePopups()">إغلاق</button><b>الإعدادات</b><span></span></div>
        <div style="padding:20px;">
            <div class="btn-opt" style="display:flex; justify-content:space-between; align-items:center;">
                <span>الوضع الليلي (Dark Mode)</span>
                <input type="checkbox" id="dark-toggle" onchange="setTheme(this.checked)">
            </div>
            <p>صور البروفايل (7 صور):</p>
            <input type="file" id="pfp-up" multiple accept="image/*" onchange="handlePfps(event)">
            <textarea id="my-bio" placeholder="اكتب البايو هنا..." style="width:100%; height:100px; margin-top:15px; border-radius:10px; padding:10px; background:var(--card); color:var(--txt); border:none;"></textarea>
            <button onclick="saveProfile()" style="width:100%; padding:15px; background:var(--p); color:#fff; border:none; border-radius:15px; margin-top:20px;">حفظ كل شيء</button>
        </div>
    </div>

    <div id="profile-panel" class="panel">
        <div class="hdr"><button onclick="closePopups()">رجوع</button><b>البروفايل</b><span></span></div>
        <div class="slider" id="pfp-slider-view"></div>
        <div style="padding:20px; text-align:center;">
            <h2 id="prof-name">Carlos Oliveira</h2>
            <p id="prof-bio" style="color:var(--gray);">هذا المستخدم لم يكتب بايو بعد.</p>
        </div>
    </div>

    <div id="new-chat-panel" class="panel">
        <div class="hdr"><button onclick="closePopups()">إلغاء</button><b>بدء محادثة</b><span></span></div>
        <div style="padding:20px;">
            <input type="text" id="target-id" placeholder="يوزر الشخص أو اسم الكروب" style="width:100%; padding:15px; border-radius:15px; border:1px solid #ddd; margin-bottom:15px;">
            <button onclick="startChat()" style="width:100%; padding:15px; background:var(--p); color:#fff; border:none; border-radius:15px;">بدء</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODYwMn0.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _db = supabase.createClient(supabaseUrl, supabaseKey);

        let me = localStorage.getItem('u_u') || "";
        let friend = "";
        let selMsg = null;
        let myPfps = [];

        // تشغيل الثيم المحفوظ
        if(localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            setTimeout(() => document.getElementById('dark-toggle').checked = true, 500);
        }

        if(me) goHome();

        function login() {
            const u = document.getElementById('reg-user').value;
            const n = document.getElementById('reg-name').value;
            if(u) { localStorage.setItem('u_u', u); me = u; goHome(); }
        }

        function setTheme(isDark) {
            const theme = isDark ? 'dark' : 'light';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }

        function goHome() {
            closePopups();
            document.querySelectorAll('.scr').forEach(s => s.classList.remove('active'));
            document.getElementById('scr-main').classList.add('active');
            loadInbox();
        }

        function showPanel(id) { document.getElementById(id).classList.add('active'); }
        function closePopups() {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('msg-sheet').classList.remove('open');
            document.getElementById('overlay').style.display = 'none';
        }

        function startChat() {
            const id = document.getElementById('target-id').value;
            if(id) openChat(id);
        }

        function openChat(name) {
            friend = name;
            closePopups();
            document.querySelectorAll('.scr').forEach(s => s.classList.remove('active'));
            document.getElementById('scr-chat').classList.add('active');
            document.getElementById('chat-user-name').innerText = name;
            loadMsgs();
        }

        async function loadMsgs() {
            const { data } = await _db.from('messages').select('*').or(`and(sender.eq.${me},receiver.eq.${friend}),and(sender.eq.${friend},receiver.eq.${me})`).order('created_at', { ascending: true });
            const flow = document.getElementById('chat-flow');
            flow.innerHTML = '';
            data?.forEach(m => {
                const d = document.createElement('div');
                d.className = `bubble ${m.sender === me ? 'me' : 'them'}`;
                d.innerText = m.content;
                d.onclick = () => { selMsg = m.id; document.getElementById('msg-sheet').classList.add('open'); document.getElementById('overlay').style.display = 'block'; };
                flow.appendChild(d);
            });
            flow.scrollTop = flow.scrollHeight;
        }

        async function send() {
            const inp = document.getElementById('msg-in'); if(!inp.value) return;
            await _db.from('messages').insert([{ sender: me, receiver: friend, content: inp.value }]);
            inp.value = ''; loadMsgs();
        }

        async function delForAll() { await _db.from('messages').delete().eq('id', selMsg); closePopups(); loadMsgs(); }

        async function loadInbox() {
            const { data } = await _db.from('messages').select('sender, receiver').or(`sender.eq.${me},receiver.eq.${me}`);
            const users = [...new Set(data?.map(m => m.sender === me ? m.receiver : m.sender))];
            const list = document.getElementById('inbox'); list.innerHTML = '';
            users.forEach(u => {
                const item = document.createElement('div');
                item.style = "padding:15px; background:var(--card); border-radius:15px; margin-bottom:10px; font-weight:bold; cursor:pointer;";
                item.innerText = u;
                item.onclick = () => openChat(u);
                list.appendChild(item);
            });
        }

        // التعامل مع الـ 7 صور
        function handlePfps(e) {
            const files = Array.from(e.target.files).slice(0, 7);
            myPfps = [];
            files.forEach(f => {
                const reader = new FileReader();
                reader.onload = (re) => myPfps.push(re.target.result);
                reader.readAsDataURL(f);
            });
        }

        async function saveProfile() {
            const bio = document.getElementById('my-bio').value;
            await _db.from('profiles').upsert([{ username: me, bio: bio, pfps: myPfps }]);
            alert("تم حفظ البروفايل!"); closePopups();
        }

        async function showFriendProfile() {
            const { data } = await _db.from('profiles').select('*').eq('username', friend).single();
            const slider = document.getElementById('pfp-slider-view');
            slider.innerHTML = '';
            if(data?.pfps) {
                data.pfps.forEach(img => slider.innerHTML += `<img src="${img}">`);
            } else {
                slider.innerHTML = `<div style="color:white; padding:100px;">لا توجد صور</div>`;
            }
            document.getElementById('prof-name').innerText = friend;
            document.getElementById('prof-bio').innerText = data?.bio || "لا يوجد بايو.";
            showPanel('profile-panel');
        }

        setInterval(() => { if(document.getElementById('scr-chat').classList.contains('active')) loadMsgs(); }, 4000);
    </script>
</body>
</html>
