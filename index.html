<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatt App</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #1a2236;
            --sidebar-color: #242f4d;
            --accent-color: #4f6ef7;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Style */
        .sidebar { width: 350px; background: var(--sidebar-color); border-left: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 24px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        .search-container { padding: 0 15px 20px; }
        .search-bar { width: 100%; background: #1e293b; border: 1px solid var(--accent-color); padding: 10px; border-radius: 20px; color: white; outline: none; box-sizing: border-box; }

        .conv-list { flex: 1; overflow-y: auto; }
        .conv-item { display: flex; align-items: center; padding: 15px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #1e293b; }
        .conv-item:hover { background: #2d3a5d; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--accent-color); margin-left: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        .conv-info { flex: 1; }
        .conv-name { font-weight: bold; margin-bottom: 4px; }
        .conv-msg { font-size: 13px; color: var(--text-dim); }

        /* Main Chat Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
        .chat-header { padding: 15px 25px; background: var(--sidebar-color); border-bottom: 1px solid #334155; font-weight: bold; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { background: #2d3a5d; padding: 12px 18px; border-radius: 18px; max-width: 70%; align-self: flex-start; line-height: 1.5; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .my-msg { align-self: flex-end; background: var(--accent-color); }

        .input-area { padding: 20px; background: var(--sidebar-color); display: flex; gap: 10px; align-items: center; }
        .input-area input { flex: 1; background: #1e293b; border: none; padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
        .input-area button { background: var(--accent-color); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; }

        @media (max-width: 768px) { .sidebar { width: 100px; } .conv-info, .search-container, .sidebar-header span { display: none; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>Chatt</span>
            <div style="font-size: 18px; opacity: 0.7;">⚙️ ☀️</div>
        </div>
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search people by username...">
        </div>
        <div class="conv-list">
            <div class="conv-item">
                <div class="avatar" style="background: #8b5cf6;">N</div>
                <div class="conv-info">
                    <div class="conv-name">NMT 👥</div>
                    <div class="conv-msg">ان شاء الله احسن</div>
                </div>
            </div>
            <div class="conv-item">
                <div class="avatar" style="background: #ec4899;">T</div>
                <div class="conv-info">
                    <div class="conv-name">Tepa</div>
                    <div class="conv-msg">ابن فرناس</div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">ماري (أنتِ) 💬</div>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODYwMn0.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchMessages() {
            const { data, error } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if (error) return;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'msg my-msg'; // افتراضياً كل رسائلك تظهر ملونة
                div.textContent = msg.content;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            if (!input.value.trim()) return;
            const { error } = await _supabase.from('messages').insert([{ content: input.value }]);
            if (!error) { input.value = ''; fetchMessages(); }
        }

        setInterval(fetchMessages, 3000);
        fetchMessages();
    </script>
</body>
</html>
