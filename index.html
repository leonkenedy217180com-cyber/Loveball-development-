<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatt Real-Time</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #007bff; --bg: #f0f2f5; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; height: 100vh; display: flex; flex-direction: column; }
        
        .screen { display: none; height: 100vh; flex-direction: column; width: 100%; }
        .active { display: flex; }

        /* شاشة الدخول */
        .login-container { background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 80%; max-width: 350px; margin: auto; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* الشاشة الرئيسية */
        .header { background: var(--white); padding: 15px; font-weight: bold; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .inbox { flex: 1; overflow-y: auto; padding: 15px; }
        .user-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 2px solid #eee; }

        /* شاشة الدردشة */
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; background: #e5ddd5; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 70%; font-size: 14px; position: relative; }
        .sent { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .received { align-self: flex-start; background: white; border-bottom-left-radius: 2px; }

        /* شريط الإرسال - واضح جداً */
        .input-bar { background: white; padding: 10px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #ddd; }
        .input-bar input { margin: 0; flex: 1; border-radius: 20px; background: #f0f2f5; padding-left: 20px; }
        .send-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; color: white; border: none; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h2>تسجيل الدخول</h2>
            <input type="text" id="my-name" placeholder="الاسم الشخصي">
            <input type="text" id="my-user" placeholder="اليوزر نيم">
            <button onclick="login()">دخول الحساب</button>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="header">
            <span>محادثاتي</span>
            <button onclick="searchUser()" style="width: auto; padding: 5px 15px;">🔍 بحث</button>
        </div>
        <div id="inbox-list" class="inbox"></div>
    </div>

    <div id="chat-screen" class="screen">
        <div class="header">
            <button onclick="showMain()" style="width: auto;">🔙</button>
            <span id="chat-title">اسم الصديق</span>
            <span></span>
        </div>
        <div id="chat-area"></div>
        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="اكتب رسالة هنا...">
            <button class="send-btn" onclick="send()">➤</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODYwMn0.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = localStorage.getItem('chat_user') || "";
        let chatFriend = "";

        if(currentUser) showMain();

        async function login() {
            const name = document.getElementById('my-name').value;
            const user = document.getElementById('my-user').value;
            if(name && user) {
                // حفظ المستخدم في جدول Profiles حتى يصير قابل للبحث
                await _supabase.from('profiles').upsert([{ username: user, full_name: name }]);
                localStorage.setItem('chat_user', user);
                currentUser = user;
                showMain();
            }
        }

        function showMain() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('main-screen').classList.add('active');
            loadInbox();
        }

        async function searchUser() {
            const target = prompt("أدخل يوزر الشخص للبحث عنه:");
            if(!target) return;

            // محرك بحث حقيقي
            const { data, error } = await _supabase.from('profiles').select('*').eq('username', target).single();
            
            if(data) {
                chatFriend = target;
                openChat();
            } else {
                alert("هذا اليوزر غير موجود في النظام!");
            }
        }

        function openChat() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('chat-screen').classList.add('active');
            document.getElementById('chat-title').innerText = chatFriend;
            loadMessages();
        }

        async function loadMessages() {
            if(!chatFriend) return;
            const { data } = await _supabase.from('messages').select('*')
                .or(`and(sender.eq.${currentUser},receiver.eq.${chatFriend}),and(sender.eq.${chatFriend},receiver.eq.${currentUser})`)
                .order('created_at', { ascending: true });
            
            const area = document.getElementById('chat-area');
            area.innerHTML = '';
            data?.forEach(m => {
                const div = document.createElement('div');
                div.className = 'msg ' + (m.sender === currentUser ? 'sent' : 'received');
                div.textContent = m.content;
                area.appendChild(div);
            });
            area.scrollTop = area.scrollHeight;
        }

        async function send() {
            const input = document.getElementById('msg-input');
            if(!input.value) return;
            await _supabase.from('messages').insert([{ content: input.value, sender: currentUser, receiver: chatFriend }]);
            input.value = '';
            loadMessages();
        }

        async function loadInbox() {
            const { data } = await _supabase.from('messages').select('sender, receiver').or(`sender.eq.${currentUser},receiver.eq.${currentUser}`);
            const list = document.getElementById('inbox-list');
            const users = [...new Set(data?.map(m => m.sender === currentUser ? m.receiver : m.sender))];
            list.innerHTML = users.length ? '' : '<p style="text-align:center; color:grey;">لا توجد محادثات</p>';
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `<b>${u}</b>`;
                div.onclick = () => { chatFriend = u; openChat(); };
                list.appendChild(div);
            });
        }

        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
