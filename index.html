<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatt 50</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --side: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* شاشة تسجيل الدخول */
        #login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: var(--side); padding: 40px; border-radius: 24px; text-align: center; width: 300px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        /* واجهة البرنامج */
        .sidebar { width: 320px; background: var(--side); border-left: 1px solid #334155; display: flex; flex-direction: column; }
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }

        /* العناصر */
        input { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 12px; color: white; outline: none; margin: 10px 0; width: 100%; box-sizing: border-box; }
        button { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.9; }

        .search-box { padding: 20px; border-bottom: 1px solid #334155; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #0a0f1d; }
        
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 75%; font-size: 15px; line-height: 1.4; }
        .sent { align-self: flex-end; background: var(--accent); border-bottom-left-radius: 4px; }
        .received { align-self: flex-start; background: #334155; border-bottom-right-radius: 4px; }

        .settings { padding: 15px; display: flex; justify-content: space-between; background: var(--side); border-top: 1px solid #334155; }
        .color-dots { display: flex; gap: 8px; align-items: center; }
        .dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .dot:hover { border-color: white; }

        @media (max-width: 600px) { .sidebar { width: 80px; } .sidebar span, .search-box, .sidebar h2 { display: none; } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <p style="font-size: 12px; color: #94a3b8;">أدخل اسم المستخدم الخاص بك</p>
        <input type="text" id="user-in" placeholder="Username...">
        <button onclick="enterChat()">دخول</button>
    </div>
</div>

<div class="sidebar">
    <div style="padding: 25px;"><h2>Chatt</h2></div>
    <div class="search-box">
        <input type="text" id="find-user" placeholder="ابحث عن يوزر صديقك...">
        <button onclick="openChat()">بحث وبدء المحادثة</button>
    </div>
    <div style="flex: 1; padding: 20px; color: #64748b; font-size: 13px;">
        الحد الأقصى للمشتركين: 50
    </div>
    <div class="settings">
        <div class="color-dots">
            <div class="dot" style="background: #3b82f6;" onclick="setTheme('#3b82f6')"></div>
            <div class="dot" style="background: #ec4899;" onclick="setTheme('#ec4899')"></div>
            <div class="dot" style="background: #8b5cf6;" onclick="setTheme('#8b5cf6')"></div>
            <div class="dot" style="background: #10b981;" onclick="setTheme('#10b981')"></div>
        </div>
        <span style="cursor:pointer">⚙️</span>
    </div>
</div>

<div class="main-content">
    <div id="header" style="padding: 18px; background: var(--side); font-weight: bold; border-bottom: 1px solid #334155;">
        اختر صديقاً لبدء الدردشة
    </div>
    <div id="chat-box"></div>
    <div style="padding: 20px; background: var(--side); display: flex; gap: 10px;">
        <input type="text" id="msg-input" placeholder="اكتب رسالة..." style="margin:0;">
        <button onclick="send()" style="width: 60px;">➤</button>
    </div>
</div>

<script>
    const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODYwMn0.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let me = "";
    let friend = "";

    function enterChat() {
        me = document.getElementById('user-in').value.trim();
        if(me) document.getElementById('login-overlay').style.display = 'none';
    }

    function openChat() {
        friend = document.getElementById('find-user').value.trim();
        if(friend) {
            document.getElementById('header').innerText = "المحادثة مع: " + friend;
            load();
        }
    }

    async function load() {
        if(!friend) return;
        const { data } = await _supabase.from('messages').select('*')
            .or(`and(sender.eq.${me},receiver.eq.${friend}),and(sender.eq.${friend},receiver.eq.${me})`)
            .order('created_at', { ascending: true });

        const box = document.getElementById('chat-box');
        box.innerHTML = '';
        if(data) data.forEach(m => {
            const d = document.createElement('div');
            d.className = 'msg ' + (m.sender === me ? 'sent' : 'received');
            d.textContent = m.content;
            box.appendChild(d);
        });
        box.scrollTop = box.scrollHeight;
    }

    async function send() {
        const inp = document.getElementById('msg-input');
        if(!inp.value || !friend) return;
        await _supabase.from('messages').insert([{ content: inp.value, sender: me, receiver: friend }]);
        inp.value = '';
        load();
    }

    function setTheme(c) { document.documentElement.style.setProperty('--accent', c); }
    setInterval(load, 3000);
</script>
</body>
</html>
