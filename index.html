<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatt Pro Max</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #007bff; --bg: #f0f2f5; --txt: #333; --chat-bg: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .screen { display: none; height: 100vh; flex-direction: column; width: 100%; position: absolute; background: var(--bg); }
        .active { display: flex; }

        /* الهيدر */
        .hdr { background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; font-weight: bold; }
        
        /* شاشة المحادثة */
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background-size: cover; background-position: center; background-image: none; background-color: var(--chat-bg); }
        .bubble { padding: 10px 15px; border-radius: 18px; max-width: 75%; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .them { align-self: flex-start; background: white; border-bottom-left-radius: 2px; }

        /* شريط الإدخال */
        .in-bar { background: white; padding: 10px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        .in-bar input { flex: 1; border: none; background: #f0f2f5; padding: 12px; border-radius: 25px; outline: none; }

        /* الإعدادات */
        .settings-panel { padding: 20px; }
        .opt-row { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .hidden-file { display: none; }

        /* الناف بار */
        .nav { height: 60px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; }
        .nav i { font-size: 24px; cursor: pointer; color: #666; }
        .active-i { color: var(--p); }
    </style>
</head>
<body>

    <div id="login-scr" class="screen active" style="justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:20px; width:80%; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,0.1);">
            <h2>Chatt</h2>
            <input type="text" id="reg-name" placeholder="الاسم المستعار">
            <input type="text" id="reg-user" placeholder="اليوزر نيم">
            <button onclick="saveUser()" style="width:100%; padding:12px; background:var(--p); color:white; border:none; border-radius:10px;">دخول</button>
        </div>
    </div>

    <div id="main-scr" class="screen">
        <div class="hdr">محادثاتي <span onclick="search()">🔍</span></div>
        <div id="list" style="flex:1; overflow-y:auto; padding:15px;"></div>
        <div class="nav">
            <span onclick="goMain()" class="active-i">💬</span>
            <span onclick="goSet()">⚙️</span>
        </div>
    </div>

    <div id="chat-scr" class="screen">
        <div class="hdr">
            <span onclick="goMain()">🔙</span>
            <span id="friend-name">اسم الصديق</span>
            <span onclick="goSet()">⚙️</span>
        </div>
        <div id="chat-area"></div>
        <div class="in-bar">
            <input type="text" id="msg-in" placeholder="اكتب رسالتك...">
            <button onclick="send()" style="border:none; background:var(--p); color:white; border-radius:50%; width:45px; height:45px;">➤</button>
        </div>
    </div>

    <div id="set-scr" class="screen">
        <div class="hdr">الإعدادات <span onclick="goMain()">✕</span></div>
        <div class="settings-panel">
            <div class="opt-row" onclick="document.getElementById('bg-upload').click()">
                <span>تغيير خلفية المحادثة (من المعرض)</span>
                <span>🖼️</span>
            </div>
            <input type="file" id="bg-upload" class="hidden-file" accept="image/*" onchange="updateBg(event)">
            
            <div class="opt-row" onclick="resetBg()">
                <span>استعادة الخلفية الافتراضية</span>
                <span>🔄</span>
            </div>

            <div class="opt-row">
                <span>وضع الليلي</span>
                <input type="checkbox" onchange="toggleDark(this)">
            </div>

            <div class="opt-row" onclick="clearLocal()">
                <span style="color:red;">تسجيل الخروج</span>
                <span>🚪</span>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODYwMn0.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _db = supabase.createClient(supabaseUrl, supabaseKey);

        let me = localStorage.getItem('chat_u') || "";
        let friend = "";

        // تحميل الخلفية المحفوظة
        const savedBg = localStorage.getItem('chat_bg');
        if(savedBg) document.getElementById('chat-area').style.backgroundImage = `url(${savedBg})`;

        if(me) goMain();

        async function saveUser() {
            const n = document.getElementById('reg-name').value;
            const u = document.getElementById('reg-user').value;
            if(n && u) {
                await _db.from('profiles').upsert([{ username: u, full_name: n }]);
                localStorage.setItem('chat_u', u);
                me = u; goMain();
            }
        }

        function goMain() { show('main-scr'); loadInbox(); }
        function goSet() { show('set-scr'); }
        function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

        async function search() {
            const f = prompt("يوزر الصديق:");
            if(!f) return;
            const { data } = await _db.from('profiles').select('*').eq('username', f).single();
            if(data) { friend = f; openChat(); } else { alert("غير موجود!"); }
        }

        function openChat() { show('chat-scr'); document.getElementById('friend-name').innerText = friend; loadMsgs(); }

        async function loadMsgs() {
            if(!document.getElementById('chat-scr').classList.contains('active')) return;
            const { data } = await _db.from('messages').select('*').or(`and(sender.eq.${me},receiver.eq.${friend}),and(sender.eq.${friend},receiver.eq.${me})`).order('created_at', { ascending: true });
            const area = document.getElementById('chat-area');
            area.innerHTML = '';
            data?.forEach(m => {
                const d = document.createElement('div');
                d.className = 'bubble ' + (m.sender === me ? 'me' : 'them');
                d.textContent = m.content;
                area.appendChild(d);
            });
            area.scrollTop = area.scrollHeight;
        }

        async function send() {
            const i = document.getElementById('msg-in');
            if(!i.value) return;
            await _db.from('messages').insert([{ content: i.value, sender: me, receiver: friend }]);
            i.value = ''; loadMsgs();
        }

        async function loadInbox() {
            const { data } = await _db.from('messages').select('sender, receiver').or(`sender.eq.${me},receiver.eq.${me}`);
            const users = [...new Set(data?.map(m => m.sender === me ? m.receiver : m.sender))];
            const list = document.getElementById('list');
            list.innerHTML = users.length ? '' : '<p style="text-align:center;color:#999;">لا توجد محادثات</p>';
            users.forEach(u => {
                const d = document.createElement('div');
                d.style = "background:white; padding:15px; border-radius:12px; margin-bottom:10px; cursor:pointer; font-weight:bold;";
                d.innerText = u;
                d.onclick = () => { friend = u; openChat(); };
                list.appendChild(d);
            });
        }

        function updateBg(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const url = e.target.result;
                document.getElementById('chat-area').style.backgroundImage = `url(${url})`;
                localStorage.setItem('chat_bg', url);
                alert("تم تغيير الخلفية بنجاح!");
            };
            reader.readAsDataURL(file);
        }

        function resetBg() {
            document.getElementById('chat-area').style.backgroundImage = 'none';
            localStorage.removeItem('chat_bg');
            alert("تمت العودة للخلفية الافتراضية");
        }

        function toggleDark(cb) {
            document.body.style.filter = cb.checked ? 'invert(1) hue-rotate(180deg)' : 'none';
        }

        function clearLocal() { localStorage.clear(); location.reload(); }

        setInterval(loadMsgs, 3000);
    </script>
</body>
</html>
