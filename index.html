<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatt Ultimate Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* المتغيرات الأساسية ودعم الوضع الليلي */
        :root { --p: #007bff; --bg: #ffffff; --txt: #000; --card: #f2f2f7; --gray: #8e8e93; --header-bg: #fff; }
        [data-theme="dark"] { --bg: #121212; --txt: #ffffff; --card: #1c1c1e; --gray: #8e8e93; --header-bg: #1c1c1e; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: background 0.3s, color 0.3s; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--txt); overflow: hidden; }

        /* الشاشات ودعم التدوير */
        .scr { display: none; height: 100vh; width: 100%; position: absolute; flex-direction: column; background: var(--bg); }
        .scr.active { display: flex; transform: none; }
        
        /* الهيدر */
        .hdr { height: 60px; border-bottom: 1px solid rgba(128,128,128,0.2); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; flex-shrink: 0; background: var(--header-bg); }
        .hdr b { font-size: 18px; font-weight: 800; }

        /* منطقة المحادثة - تدعم الخلفية والصور */
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 10px; }
        
        /* فقاعات الرسائل */
        .bubble { padding: 12px 16px; border-radius: 20px; max-width: 80%; font-size: 15px; position: relative; cursor: pointer; word-wrap: break-word; }
        .me { align-self: flex-end; background: var(--p); color: #fff; border-bottom-right-radius: 4px; }
        .them { align-self: flex-start; background: var(--card); color: var(--txt); border-bottom-left-radius: 4px; }

        /* صندوق الإرسال الثابت */
        .input-bar { padding: 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(128,128,128,0.2); background: var(--header-bg); }
        .input-wrap { flex: 1; background: var(--card); border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; }
        .input-wrap input { flex: 1; border: none; background: transparent; color: var(--txt); padding: 10px; outline: none; }

        /* القوائم المنبثقة (Popups) */
        .popup-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; flex-direction: column; }
        .popup-panel.active { display: flex; }

        /* زر الإرسال */
        .send-btn { background: var(--p); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        /* البوتوم شيت (خيارات الحذف) */
        .b-sheet { position: fixed; bottom: -100%; width: 100%; background: var(--header-bg); border-radius: 20px 20px 0 0; padding: 20px; transition: 0.4s; z-index: 2000; box-shadow: 0 -5px 15px rgba(0,0,0,0.2); }
        .b-sheet.open { bottom: 0; }
        .sheet-btn { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 12px; background: var(--card); color: var(--txt); font-weight: bold; font-size: 16px; }
        .delete-all { color: #ff3b30; }

        /* السلايدر لصور البروفايل */
        .pfp-slider { width: 100%; height: 300px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #000; }
        .pfp-slider img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; scroll-snap-align: center; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div id="scr-login" class="scr active" style="justify-content:center; align-items:center;">
        <div style="width:85%; text-align:center;">
            <h1 style="font-size:40px; margin-bottom:30px;">Chatt</h1>
            <input type="text" id="reg-name" placeholder="اسمك الكامل" style="width:100%; padding:15px; margin-bottom:10px; border-radius:12px; border:1px solid #ddd;">
            <input type="text" id="reg-user" placeholder="اليوزر نيم" style="width:100%; padding:15px; margin-bottom:20px; border-radius:12px; border:1px solid #ddd;">
            <button onclick="saveUser()" style="width:100%; padding:15px; background:var(--p); color:#fff; border:none; border-radius:12px; font-weight:bold;">ابدأ الآن</button>
        </div>
    </div>

    <div id="scr-main" class="scr">
        <div class="hdr">
            <button onclick="openPanel('settings-panel')" style="border:none; background:none; font-size:20px;">⚙️</button>
            <b>محادثاتي</b>
            <button onclick="openPanel('search-panel')" style="border:none; background:none; font-size:20px;">➕</button>
        </div>
        <div id="inbox-list" style="flex:1; overflow-y:auto; padding:15px;"></div>
    </div>

    <div id="scr-chat" class="scr">
        <div class="hdr">
            <button onclick="goHome()" style="border:none; background:none; font-size:18px;">⬅️</button>
            <div onclick="viewFriendProfile()" style="text-align:center;">
                <b id="chat-title">اسم الصديق</b>
                <div id="online-status" style="font-size:10px; color:#34c759;">متصل الآن</div>
            </div>
            <div id="chat-pfp" style="width:35px; height:35px; border-radius:50%; background:#ddd; background-size:cover;"></div>
        </div>
        <div id="chat-flow"></div>
        <div class="input-bar">
            <button style="border:none; background:none; font-size:20px;">📎</button>
            <div class="input-wrap">
                <input type="text" id="msg-input" placeholder="اكتب رسالة...">
            </div>
            <button onclick="sendMsg()" class="send-btn">➤</button>
        </div>
    </div>

    <div id="delete-sheet" class="b-sheet">
        <button class="sheet-btn" onclick="copyMsg()">نسخ النص</button>
        <button class="sheet-btn" onclick="deleteForMe()">حذف عندي فقط</button>
        <button class="sheet-btn delete-all" onclick="deleteForEveryone()">حذف من الجميع 🗑️</button>
        <button class="sheet-btn" onclick="closeAll()" style="background:none;">إلغاء</button>
    </div>

    <div id="settings-panel" class="popup-panel">
        <div class="hdr">
            <button onclick="closeAll()" style="border:none; background:none;">Done</button>
            <b>الإعدادات</b>
            <span></span>
        </div>
        <div style="padding:20px;">
            <div class="sheet-btn" style="display:flex; justify-content:space-between; align-items:center;">
                <span>الوضع الليلي</span>
                <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode(this.checked)">
            </div>
            <hr style="opacity:0.1; margin:20px 0;">
            <p>بايو الحساب:</p>
            <textarea id="my-bio" style="width:100%; height:80px; border-radius:10px; padding:10px; background:var(--card); color:var(--txt); border:none;"></textarea>
            <button onclick="saveProfile()" style="width:100%; padding:15px; background:var(--p); color:#fff; border:none; border-radius:12px; margin-top:20px;">حفظ التغييرات</button>
        </div>
    </div>

    <div id="search-panel" class="popup-panel">
        <div class="hdr"><button onclick="closeAll()">إغلاق</button><b>بدء محادثة</b><span></span></div>
        <div style="padding:20px;">
            <input type="text" id="target-user" placeholder="يوزر الشخص أو اسم الكروب" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:15px;">
            <button onclick="startChat()" style="width:100%; padding:15px; background:var(--p); color:#fff; border:none; border-radius:12px;">دخول</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODI2MDJ9.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _db = supabase.createClient(supabaseUrl, supabaseKey);

        let me = localStorage.getItem('u_u') || "";
        let chatTarget = "";
        let selMsgId = null;

        // تطبيق الثيم المحفوظ فوراً عند التحميل
        const savedTheme = localStorage.getItem('theme');
        if(savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            setTimeout(() => { if(document.getElementById('dark-mode-toggle')) document.getElementById('dark-mode-toggle').checked = true; }, 500);
        }

        if(me) goHome();

        async function saveUser() {
            const u = document.getElementById('reg-user').value;
            const n = document.getElementById('reg-name').value;
            if(u && n) {
                await _db.from('profiles').upsert([{ username: u, full_name: n }]);
                localStorage.setItem('u_u', u);
                me = u; goHome();
            }
        }

        function goHome() {
            closeAll();
            document.querySelectorAll('.scr').forEach(s => s.classList.remove('active'));
            document.getElementById('scr-main').classList.add('active');
            loadInbox();
        }

        function toggleDarkMode(isDark) {
            if(isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            }
        }

        function openPanel(id) { document.getElementById(id).classList.add('active'); }
        function closeAll() {
            document.querySelectorAll('.popup-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('delete-sheet').classList.remove('open');
            document.getElementById('overlay').style.display = 'none';
        }

        function startChat() {
            const t = document.getElementById('target-user').value;
            if(t) openChat(t);
        }

        function openChat(name) {
            chatTarget = name;
            closeAll();
            document.querySelectorAll('.scr').forEach(s => s.classList.remove('active'));
            document.getElementById('scr-chat').classList.add('active');
            document.getElementById('chat-title').innerText = name;
            loadMsgs();
        }

        async function loadMsgs() {
            const { data } = await _db.from('messages').select('*').or(`and(sender.eq.${me},receiver.eq.${chatTarget}),and(sender.eq.${chatTarget},receiver.eq.${me})`).order('created_at', { ascending: true });
            const flow = document.getElementById('chat-flow');
            flow.innerHTML = '';
            data?.forEach(m => {
                const b = document.createElement('div');
                b.className = `bubble ${m.sender === me ? 'me' : 'them'}`;
                b.innerText = m.content;
                b.onclick = () => { selMsgId = m.id; openDeleteMenu(); };
                flow.appendChild(b);
            });
            flow.scrollTop = flow.scrollHeight;
        }

        async function sendMsg() {
            const inp = document.getElementById('msg-input');
            if(!inp.value) return;
            await _db.from('messages').insert([{ sender: me, receiver: chatTarget, content: inp.value }]);
            inp.value = ''; loadMsgs();
        }

        function openDeleteMenu() {
            document.getElementById('delete-sheet').classList.add('open');
            document.getElementById('overlay').style.display = 'block';
        }

        async function deleteForMe() {
            // محاكاة حذف محلي (أو إضافة عمود 'deleted_by' في الداتابيس)
            alert("تم الحذف من عندك فقط");
            closeAll();
        }

        async function deleteForEveryone() {
            await _db.from('messages').delete().eq('id', selMsgId);
            closeAll();
            loadMsgs();
        }

        async function loadInbox() {
            const { data } = await _db.from('messages').select('sender, receiver').or(`sender.eq.${me},receiver.eq.${me}`);
            const unique = [...new Set(data?.map(m => m.sender === me ? m.receiver : m.sender))];
            const list = document.getElementById('inbox-list');
            list.innerHTML = '';
            unique.forEach(u => {
                const item = document.createElement('div');
                item.style = "padding:15px; background:var(--card); margin-bottom:10px; border-radius:15px; font-weight:bold; cursor:pointer;";
                item.innerText = u;
                item.onclick = () => openChat(u);
                list.appendChild(item);
            });
        }

        setInterval(() => { if(document.getElementById('scr-chat').classList.contains('active')) loadMsgs(); }, 4000);
    </script>
</body>
</html>
