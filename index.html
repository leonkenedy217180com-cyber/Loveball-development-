<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatt Final Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #007aff; --bg: #f2f2f7; --card: #ffffff; --txt: #000; --border: rgba(0,0,0,0.1); }
        [data-theme="dark"] { --bg: #000; --card: #1c1c1e; --txt: #fff; --border: rgba(255,255,255,0.1); }
        body { margin: 0; background: var(--bg); color: var(--txt); font-family: -apple-system, sans-serif; overflow: hidden; }
        
        .scr { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        .active { display: flex; }

        /* الهيدر */
        .hdr { height: 80px; padding: 35px 15px 10px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border-bottom: 0.5px solid var(--border); }
        .pfp-circle { width: 35px; height: 35px; border-radius: 50%; background: #ddd; background-size: cover; cursor: pointer; border: 1px solid var(--border); }

        /* الرسائل */
        #flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 16px; line-height: 1.4; }
        .me { align-self: flex-end; background: var(--p); color: #fff; border-bottom-right-radius: 4px; }
        .them { align-self: flex-start; background: var(--card); color: var(--txt); border-bottom-left-radius: 4px; border: 0.5px solid var(--border); }

        /* شريط الإدخال */
        .bar { padding: 10px 15px 30px; background: var(--card); border-top: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .in-box { flex: 1; background: var(--bg); border-radius: 20px; padding: 8px 15px; border: 0.5px solid var(--border); }
        .in-box input { width: 100%; border: none; background: transparent; outline: none; color: var(--txt); font-size: 16px; }

        /* شبكة الصور */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; }
        .slot { aspect-ratio: 1; background: var(--bg); border-radius: 10px; border: 1px dashed var(--p); overflow: hidden; }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="home-scr" class="scr active">
        <div class="hdr">
            <div class="pfp-circle" onclick="show('set-scr')"></div>
            <h2 style="margin:0">محادثاتي</h2>
            <button onclick="startChat()" style="background:none; border:none; color:var(--p); font-size:24px;">+</button>
        </div>
        <div id="inbox-list" style="padding:15px;"></div>
    </div>

    <div id="chat-scr" class="scr">
        <div class="hdr" style="height:65px; padding-top:15px;">
            <button onclick="show('home-scr')" style="background:none; border:none; color:var(--p); font-size:16px;">❮ رجوع</button>
            <b id="chat-with-name">...</b>
            <div class="pfp-circle" style="width:30px; height:30px;"></div>
        </div>
        <div id="flow"></div>
        <div class="bar">
            <button style="background:none; border:none; color:var(--p); font-size:22px;">+</button>
            <div class="in-box">
                <input type="text" id="m-input" placeholder="اكتب رسالة..." onkeyup="if(event.key==='Enter') sendMsg()">
            </div>
            <button onclick="sendMsg()" style="background:none; border:none; color:var(--p); font-weight:700;">إرسال</button>
        </div>
    </div>

    <div id="set-scr" class="scr" style="overflow-y:auto;">
        <div class="hdr" style="height:60px; padding-top:10px;">
            <button onclick="show('home-scr')" style="background:none; border:none; color:var(--p);">إغلاق</button>
            <b>الإعدادات</b>
            <span></span>
        </div>
        <div style="padding:20px; background:var(--card); margin:15px; border-radius:15px;">
            <label style="display:flex; justify-content:space-between; align-items:center;">
                <span>الوضع الليلي</span>
                <input type="checkbox" id="dark-btn" onchange="toggleDark(this.checked)">
            </label>
        </div>
        <div style="background:var(--card); margin:15px; border-radius:15px; padding-bottom:15px;">
            <div style="padding:15px; font-weight:bold;">صور البروفايل (7 صور)</div>
            <div class="grid" id="grid"></div>
            <button onclick="document.getElementById('file-in').click()" style="width:100%; color:var(--p); background:none; border:none; padding:10px;">اختر الصور من جهازك</button>
            <input type="file" id="file-in" multiple accept="image/*" style="display:none;" onchange="loadPics(event)">
        </div>
        <button onclick="saveAll()" style="margin:10px 15px; padding:15px; background:var(--p); color:white; border:none; border-radius:12px; font-weight:bold;">حفظ كل شيء</button>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODI2MDJ9.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _db = supabase.createClient(supabaseUrl, supabaseKey);

        let user = localStorage.getItem('user') || "";
        let peer = "";
        let pics = JSON.parse(localStorage.getItem('pics') || "[]");

        if(!user) { user = prompt("ادخل اسمك (اليوزر):"); localStorage.setItem('user', user); }
        if(localStorage.getItem('dark')==='yes') { document.body.setAttribute('data-theme','dark'); document.getElementById('dark-btn').checked=true; }

        function show(id) { 
            document.querySelectorAll('.scr').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id==='set-scr') renderGrid();
        }

        function toggleDark(is) { 
            document.body.setAttribute('data-theme', is ? 'dark' : 'light');
            localStorage.setItem('dark', is ? 'yes' : 'no');
        }

        function renderGrid() {
            const g = document.getElementById('grid'); g.innerHTML = '';
            for(let i=0; i<7; i++) g.innerHTML += `<div class="slot">${pics[i]?`<img src="${pics[i]}">`:''}</div>`;
        }

        function loadPics(e) {
            const files = Array.from(e.target.files).slice(0, 7);
            pics = [];
            files.forEach(f => {
                const r = new FileReader();
                r.onload = (ev) => { pics.push(ev.target.result); renderGrid(); };
                r.readAsDataURL(f);
            });
        }

        async function saveAll() {
            localStorage.setItem('pics', JSON.stringify(pics));
            await _db.from('profiles').upsert([{ username: user, pfps: pics }]);
            alert("تم الحفظ!"); show('home-scr');
        }

        function startChat() { let p = prompt("يوزر الشخص:"); if(p) { peer = p; document.getElementById('chat-with-name').innerText=p; show('chat-scr'); sync(); } }

        async function sendMsg() {
            const i = document.getElementById('m-input'); if(!i.value) return;
            const text = i.value; i.value = '';
            await _db.from('messages').insert([{ sender: user, receiver: peer, content: text }]);
            sync();
        }

        async function sync() {
            const { data } = await _db.from('messages').select('*').or(`and(sender.eq.${user},receiver.eq.${peer}),and(sender.eq.${peer},receiver.eq.${user})`).order('created_at', { ascending: true });
            const f = document.getElementById('flow'); f.innerHTML = '';
            data?.forEach(m => f.innerHTML += `<div class="msg ${m.sender === user ? 'me' : 'them'}">${m.content}</div>`);
            f.scrollTop = f.scrollHeight;
        }

        setInterval(() => { if(document.getElementById('chat-scr').classList.contains('active')) sync(); }, 3000);
    </script>
</body>
</html>
