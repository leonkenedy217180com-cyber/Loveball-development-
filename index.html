<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatt Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main-bg: #f8f9fa; --accent: #007bff; --text-dark: #333; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--main-bg); color: var(--text-dark); margin: 0; height: 100vh; overflow: hidden; }
        
        /* نظام الشاشات */
        .screen { display: none; height: 100vh; width: 100%; position: absolute; flex-direction: column; animation: fadeIn 0.3s; }
        .active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* شاشة الدخول - فخمة */
        #login-screen { background: linear-gradient(135deg, #007bff, #6610f2); justify-content: center; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 30px; width: 85%; max-width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; }
        .login-card h1 { color: #333; margin-bottom: 20px; }
        
        /* الشاشة الرئيسية - محادثاتي */
        .app-bar { background: var(--card-bg); padding: 15px 20px; font-size: 20px; font-weight: 700; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .inbox { flex: 1; overflow-y: auto; padding: 15px; }
        .user-row { background: white; padding: 15px; border-radius: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; }
        .user-row:active { transform: scale(0.98); }
        .user-avatar { width: 50px; height: 50px; border-radius: 18px; background: #e9ecef; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--accent); font-weight: bold; }

        /* شاشة الدردشة */
        #chat-area { flex: 1; overflow-y: auto; padding: 20px; background: #f0f2f5; display: flex; flex-direction: column; gap: 8px; }
        .bubble { padding: 10px 16px; border-radius: 20px; max-width: 75%; font-size: 15px; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .me { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .them { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 4px; }

        /* إدخال وتحكم */
        .input-box { background: white; padding: 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #eee; }
        input { flex: 1; border: none; background: #f1f3f4; padding: 12px 20px; border-radius: 25px; outline: none; }
        .btn-circle { background: var(--accent); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        
        .nav-bottom { height: 65px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; }
        .nav-icon { font-size: 24px; cursor: pointer; color: #999; }
        .nav-icon.active-icon { color: var(--accent); }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-card">
            <h1>Chatt</h1>
            <input type="text" id="in-name" placeholder="الاسم الشخصي" style="width: 100%; margin-bottom: 15px;">
            <input type="text" id="in-user" placeholder="اليوزر نيم" style="width: 100%; margin-bottom: 25px;">
            <button onclick="doLogin()" style="width:100%; background:var(--accent); color:white; border:none; padding:15px; border-radius:15px; font-weight:bold; font-size:16px;">دخول</button>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="app-bar">محادثاتي <span onclick="doSearch()" style="font-size:24px; cursor:pointer;">⊕</span></div>
        <div id="inbox-list" class="inbox">
            <div style="text-align:center; color:#999; margin-top:100px;">ابدأ أول محادثة الآن</div>
        </div>
        <div class="nav-bottom">
            <span class="nav-icon active-icon" onclick="toMain()">💬</span>
            <span class="nav-icon" onclick="toSettings()">⚙️</span>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <div class="app-bar">
            <span onclick="toMain()" style="cursor:pointer">🔙</span>
            <span id="friend-title">الاسم</span>
            <span></span>
        </div>
        <div id="chat-area"></div>
        <div class="input-box">
            <input type="text" id="msg-input" placeholder="اكتب رسالة...">
            <button class="btn-circle" onclick="hitSend()">➤</button>
        </div>
    </div>

    <div id="settings-screen" class="screen">
        <div class="app-bar">الإعدادات</div>
        <div style="padding:30px; text-align:center;">
            <p>اختر لون التطبيق المفضل:</p>
            <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
                <div onclick="setCol('#007bff')" style="width:40px; height:40px; border-radius:50%; background:#007bff;"></div>
                <div onclick="setCol('#e91e63')" style="width:40px; height:40px; border-radius:50%; background:#e91e63;"></div>
                <div onclick="setCol('#28a745')" style="width:40px; height:40px; border-radius:50%; background:#28a745;"></div>
                <div onclick="setCol('#333')" style="width:40px; height:40px; border-radius:50%; background:#333;"></div>
            </div>
        </div>
        <div class="nav-bottom">
            <span class="nav-icon" onclick="toMain()">💬</span>
            <span class="nav-icon active-icon">⚙️</span>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODI2Mn0.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _db = supabase.createClient(supabaseUrl, supabaseKey);

        let user = localStorage.getItem('u') || "";
        let fUser = "";

        if(user) toMain();

        function doLogin() {
            const n = document.getElementById('in-name').value;
            const u = document.getElementById('in-user').value;
            if(n && u) { localStorage.setItem('u', u); user = u; toMain(); }
        }

        function toMain() { 
            hideAll(); document.getElementById('main-screen').classList.add('active'); 
            loadList();
        }
        function toSettings() { hideAll(); document.getElementById('settings-screen').classList.add('active'); }
        function hideAll() { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); }

        function doSearch() {
            let f = prompt("أدخل يوزر الصديق:");
            if(f) { fUser = f; openChat(); }
        }

        function openChat() {
            hideAll(); document.getElementById('chat-screen').classList.add('active');
            document.getElementById('friend-title').innerText = fUser;
            refreshMsgs();
        }

        async function refreshMsgs() {
            if(!document.getElementById('chat-screen').classList.contains('active')) return;
            const { data } = await _db.from('messages').select('*')
                .or(`and(sender.eq.${user},receiver.eq.${fUser}),and(sender.eq.${fUser},receiver.eq.${user})`)
                .order('created_at', { ascending: true });
            
            const box = document.getElementById('chat-area');
            box.innerHTML = '';
            data?.forEach(m => {
                const div = document.createElement('div');
                div.className = 'bubble ' + (m.sender === user ? 'me' : 'them');
                div.textContent = m.content;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        async function hitSend() {
            const i = document.getElementById('msg-input');
            if(!i.value) return;
            await _db.from('messages').insert([{ content: i.value, sender: user, receiver: fUser }]);
            i.value = ''; refreshMsgs();
        }

        async function loadList() {
            const { data } = await _db.from('messages').select('sender, receiver').or(`sender.eq.${user},receiver.eq.${user}`);
            const unique = [...new Set(data?.map(m => m.sender === user ? m.receiver : m.sender))];
            const list = document.getElementById('inbox-list');
            if(unique.length > 0) {
                list.innerHTML = '';
                unique.forEach(u => {
                    const row = document.createElement('div');
                    row.className = 'user-row';
                    row.innerHTML = `<div class="user-avatar">${u[0].toUpperCase()}</div><b>${u}</b>`;
                    row.onclick = () => { fUser = u; openChat(); };
                    list.appendChild(row);
                });
            }
        }

        function setCol(c) { document.documentElement.style.setProperty('--accent', c); }
        setInterval(refreshMsgs, 3000);
    </script>
</body>
</html>
