<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chatt Pro Max</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --ios-blue: #007aff; --ios-bg: #f2f2f7; --ios-card: #ffffff; 
            --ios-text: #000000; --ios-gray: #8e8e93; --ios-border: rgba(0,0,0,0.1);
        }
        [data-theme="dark"] { 
            --ios-bg: #000000; --ios-card: #1c1c1e; --ios-text: #ffffff; 
            --ios-border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--ios-bg); color: var(--ios-text); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
            transition: background 0.3s; overflow: hidden;
        }

        /* هيدر الأيفون الشهير */
        .hdr-ios {
            height: 100px; padding-top: 45px; padding-inline: 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100; border-bottom: 0.5px solid var(--ios-border);
        }
        [data-theme="dark"] .hdr-ios { background: rgba(28,28,30,0.8); }
        .hdr-ios h1 { font-size: 32px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }

        /* الدائرة الشخصية - مدخل الإعدادات */
        .profile-trigger {
            width: 38px; height: 38px; border-radius: 50%; 
            background: var(--ios-gray); background-size: cover; background-position: center;
            border: 1px solid var(--ios-border); cursor: pointer;
        }

        /* واجهة الدردشة */
        .chat-container { display: flex; flex-direction: column; height: 100vh; }
        .messages-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 4px; background: var(--ios-bg); }
        
        .bubble { 
            max-width: 75%; padding: 8px 16px; border-radius: 18px; font-size: 16px; 
            line-height: 1.4; position: relative; word-wrap: break-word;
        }
        .me { align-self: flex-end; background: var(--ios-blue); color: white; border-bottom-right-radius: 4px; }
        .them { align-self: flex-start; background: var(--ios-card); color: var(--ios-text); border-bottom-left-radius: 4px; border: 0.5px solid var(--ios-border); }

        /* صندوق الإرسال - iMessage Style */
        .input-bar {
            padding: 10px 15px 30px; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px); border-top: 0.5px solid var(--ios-border);
            display: flex; align-items: center; gap: 12px;
        }
        [data-theme="dark"] .input-bar { background: rgba(28,28,30,0.9); }
        
        .media-btn { 
            background: none; border: none; padding: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .ios-input-field {
            flex: 1; background: var(--ios-bg); border: 0.5px solid var(--ios-border);
            border-radius: 20px; padding: 8px 12px; display: flex; align-items: center;
        }
        .ios-input-field input {
            flex: 1; border: none; background: transparent; color: var(--ios-text);
            outline: none; font-size: 16px;
        }

        /* صفحة الإعدادات والحساب */
        .full-page {
            position: fixed; inset: 0; background: var(--ios-bg); z-index: 1000;
            display: none; flex-direction: column; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .active { display: flex; }

        .settings-card {
            background: var(--ios-card); border-radius: 12px; margin: 15px; 
            overflow: hidden; border: 0.5px solid var(--ios-border);
        }
        .settings-row {
            padding: 12px 16px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 0.5px solid var(--ios-border);
        }

        /* شبكة الصور الـ 7 */
        .photo-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px;
        }
        .photo-slot {
            aspect-ratio: 1; background: var(--ios-bg); border-radius: 10px;
            border: 1px dashed var(--ios-blue); display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* أيقونات SVG فخمة */
        .icon-svg { width: 24px; height: 24px; fill: var(--ios-blue); }
    </style>
</head>
<body>

    <div id="home-scr" class="chat-container">
        <div class="hdr-ios">
            <div class="profile-trigger" id="my-avatar-top" onclick="openSettings()"></div>
            <h1>محادثات</h1>
            <button class="media-btn" onclick="startNewChat()">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </div>
        <div id="inbox-list" style="flex:1; overflow-y:auto; padding:10px;">
            </div>
    </div>

    <div id="chat-scr" class="full-page">
        <div class="hdr-ios" style="height: 70px; padding-top: 20px;">
            <button onclick="closeChat()" style="background:none; border:none; color:var(--ios-blue); font-size:17px; font-weight:600;">❮ المحادثات</button>
            <div style="text-align:center;" onclick="viewFriendProfile()">
                <b id="active-friend-name" style="display:block;">...</b>
                <span id="online-indicator" style="font-size:11px; color:#34c759;">متصل الآن</span>
            </div>
            <div id="friend-avatar-top" class="profile-trigger" style="width:34px; height:34px;"></div>
        </div>
        <div id="messages-flow" class="messages-area"></div>
        <div class="input-bar">
            <button class="media-btn" onclick="openMediaMenu()">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            </button>
            <div class="ios-input-field">
                <input type="text" id="msg-input-field" placeholder="iMessage">
            </div>
            <button onclick="processSend()" style="background:none; border:none; color:var(--ios-blue); font-weight:700; font-size:16px;">إرسال</button>
        </div>
    </div>

    <div id="settings-scr" class="full-page" style="overflow-y:auto;">
        <div class="hdr-ios" style="height:60px; padding-top:10px;">
            <button onclick="closeSettings()" style="background:none; border:none; color:var(--ios-blue); font-weight:600;">تم</button>
            <b>الإعدادات</b>
            <span></span>
        </div>
        
        <div style="text-align:center; padding:30px 0;">
            <div id="my-big-pfp" style="width:90px; height:90px; border-radius:50%; background:#ccc; margin:0 auto 15px; background-size:cover;"></div>
            <h2 id="my-name-label" style="margin:0;">اسم المستخدم</h2>
        </div>

        <div class="settings-card">
            <div class="settings-row">
                <span>الوضع الليلي (Dark Mode)</span>
                <input type="checkbox" id="dark-mode-switch" onchange="applyTheme(this.checked)">
            </div>
        </div>

        <div class="settings-card">
            <div style="padding:15px; font-weight:700; font-size:13px; color:var(--ios-gray); text-transform:uppercase;">معرض الصور (7 صور)</div>
            <div class="photo-grid" id="pfp-slots-container"></div>
            <div class="settings-row" onclick="document.getElementById('file-pfp').click()" style="color:var(--ios-blue); cursor:pointer;">إضافة صور جديدة...</div>
            <input type="file" id="file-pfp" multiple accept="image/*" style="display:none;" onchange="handlePfpChange(event)">
        </div>

        <div class="settings-card">
            <div style="padding:15px; font-weight:700; font-size:13px; color:var(--ios-gray); text-transform:uppercase;">البايو (Bio)</div>
            <textarea id="bio-text-area" style="width:100%; border:none; padding:15px; background:transparent; color:var(--ios-text); outline:none; font-size:16px;" placeholder="اكتب نبذة عنك..."></textarea>
        </div>

        <button onclick="saveAllToCloud()" style="margin:10px 15px 40px; padding:16px; background:var(--ios-blue); color:white; border:none; border-radius:14px; font-weight:800; font-size:17px;">حفظ التغييرات</button>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODI2MDJ9.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _db = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = localStorage.getItem('app_user') || "";
        let chatWith = "";
        let myGallery = JSON.parse(localStorage.getItem('app_gallery') || "[]");

        // تطبيق الثيم المحفوظ
        if(localStorage.getItem('app_theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('dark-mode-switch').checked = true;
        }

        if(!currentUser) {
            let n = prompt("ادخل اسم المستخدم (اليوزر):");
            if(n) { localStorage.setItem('app_user', n); currentUser = n; }
        }

        function applyTheme(isDark) {
            const t = isDark ? 'dark' : 'light';
            document.body.setAttribute('data-theme', t);
            localStorage.setItem('app_theme', t);
        }

        function openSettings() {
            document.getElementById('settings-scr').classList.add('active');
            document.getElementById('my-name-label').innerText = currentUser;
            refreshPfpGrid();
        }
        function closeSettings() { document.getElementById('settings-scr').classList.remove('active'); }

        function refreshPfpGrid() {
            const container = document.getElementById('pfp-slots-container');
            container.innerHTML = '';
            for(let i=0; i<7; i++) {
                container.innerHTML += `<div class="photo-slot">${myGallery[i] ? `<img src="${myGallery[i]}">` : ''}</div>`;
            }
        }

        function handlePfpChange(e) {
            const files = Array.from(e.target.files).slice(0, 7);
            myGallery = [];
            files.forEach(f => {
                const r = new FileReader();
                r.onload = (ev) => { myGallery.push(ev.target.result); refreshPfpGrid(); };
                r.readAsDataURL(f);
            });
        }

        async function saveAllToCloud() {
            const bio = document.getElementById('bio-text-area').value;
            localStorage.setItem('app_gallery', JSON.stringify(myGallery));
            await _db.from('profiles').upsert([{ username: currentUser, bio: bio, pfps: myGallery }]);
            alert("تم الحفظ بنجاح مريم!");
            closeSettings();
        }

        function startNewChat() {
            let target = prompt("ادخل يوزر الشخص أو اسم المجموعة:");
            if(target) {
                chatWith = target;
                document.getElementById('chat-scr').classList.add('active');
                document.getElementById('active-friend-name').innerText = target;
                loadConversation();
            }
        }

        function closeChat() { document.getElementById('chat-scr').classList.remove('active'); }

        async function processSend() {
            const inp = document.getElementById('msg-input-field');
            if(!inp.value) return;
            await _db.from('messages').insert([{ sender: currentUser, receiver: chatWith, content: inp.value }]);
            inp.value = '';
            loadConversation();
        }

        async function loadConversation() {
            const { data } = await _db.from('messages').select('*').or(`and(sender.eq.${currentUser},receiver.eq.${chatWith}),and(sender.eq.${chatWith},receiver.eq.${currentUser})`).order('created_at', { ascending: true });
            const area = document.getElementById('messages-flow');
            area.innerHTML = '';
            data?.forEach(m => {
                area.innerHTML += `<div class="bubble ${m.sender === currentUser ? 'me' : 'them'}">${m.content}</div>`;
            });
            area.scrollTop = area.scrollHeight;
        }

        setInterval(() => {
            if(document.getElementById('chat-scr').classList.contains('active')) loadConversation();
        }, 3000);

    </script>
</body>
</html>
