<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chatt Elite V16 - Final</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --ios-blue: #007aff; --bg: #f2f2f7; --card: #ffffff; --text: #000000; --border: rgba(0,0,0,0.1); }
        [data-theme="dark"] { --bg: #000000; --card: #1c1c1e; --text: #ffffff; --border: rgba(255,255,255,0.1); }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.3s; }

        /* الهيدر بنظام الأيفون */
        .ios-header { height: 90px; padding: 45px 20px 10px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border-bottom: 0.5px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .ios-header h1 { font-size: 32px; margin: 0; font-weight: 800; }
        
        .avatar-top { width: 36px; height: 36px; border-radius: 50%; background: #ccc; background-size: cover; border: 1px solid var(--border); cursor: pointer; }

        /* شاشات التطبيق */
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        .active { display: flex; }

        /* منطقة الرسائل */
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .bubble { max-width: 75%; padding: 10px 16px; border-radius: 20px; font-size: 16px; line-height: 1.4; position: relative; cursor: pointer; }
        .me { align-self: flex-end; background: var(--ios-blue); color: #fff; border-bottom-right-radius: 4px; }
        .them { align-self: flex-start; background: var(--card); color: var(--text); border-bottom-left-radius: 4px; border: 0.5px solid var(--border); }

        /* صندوق الإرسال الثابت (Landscape Fix) */
        .input-area { padding: 10px 15px 30px; background: var(--card); border-top: 0.5px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .input-wrapper { flex: 1; background: var(--bg); border-radius: 20px; padding: 8px 15px; border: 0.5px solid var(--border); }
        .input-wrapper input { width: 100%; border: none; background: transparent; color: var(--text); outline: none; font-size: 16px; }

        /* واجهة الإعدادات والـ 7 صور */
        .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; }
        .photo-slot { aspect-ratio: 1; background: var(--bg); border-radius: 12px; border: 1px dashed var(--ios-blue); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* قائمة الحذف (Bottom Sheet) */
        .sheet { position: fixed; bottom: -100%; width: 100%; background: var(--card); padding: 20px; border-radius: 20px 20px 0 0; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
        .sheet.open { bottom: 0; }
        .sheet-btn { width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 12px; background: var(--bg); color: var(--text); font-weight: 600; font-size: 16px; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="closePopups()"></div>

    <div id="delete-sheet" class="sheet">
        <button class="sheet-btn" onclick="deleteMsg('me')">حذف مني</button>
        <button class="sheet-btn" style="color: red;" onclick="deleteMsg('all')">حذف من الجميع</button>
        <button class="sheet-btn" onclick="closePopups()">إلغاء</button>
    </div>

    <div id="home-screen" class="screen active">
        <div class="ios-header">
            <div class="avatar-top" id="my-pfp" onclick="openScreen('settings-screen')"></div>
            <h1>محادثات</h1>
            <button onclick="createNewChat()" style="background:none; border:none; color:var(--ios-blue); font-size:28px;">⊕</button>
        </div>
        <div id="inbox-list" style="padding: 15px;"></div>
    </div>

    <div id="chat-screen" class="screen">
        <div class="ios-header" style="height: 75px; padding-top: 25px;">
            <button onclick="openScreen('home-screen')" style="background:none; border:none; color:var(--ios-blue); font-size:17px; font-weight:600;">❮ رجوع</button>
            <div style="text-align:center;">
                <b id="active-peer">اسم الصديق</b>
                <div style="font-size:11px; color:#34c759;">متصل الآن</div>
            </div>
            <div class="avatar-top" style="width:32px; height:32px;"></div>
        </div>
        <div id="chat-flow"></div>
        <div class="input-area">
            <button style="background:none; border:none; color:var(--ios-blue); font-size:24px;">⊕</button>
            <div class="input-wrapper">
                <input type="text" id="m-input" placeholder="iMessage" onkeypress="if(event.key==='Enter') performSend()">
            </div>
            <button onclick="performSend()" style="background:none; border:none; color:var(--ios-blue); font-weight:700; font-size:16px;">إرسال</button>
        </div>
    </div>

    <div id="settings-screen" class="screen" style="overflow-y:auto;">
        <div class="ios-header" style="height: 60px; padding-top: 10px;">
            <button onclick="openScreen('home-screen')" style="background:none; border:none; color:var(--ios-blue);">تم</button>
            <b>الإعدادات</b>
            <span></span>
        </div>
        <div style="padding:20px; text-align:center;">
            <div id="large-avatar" style="width:90px; height:90px; border-radius:50%; background:#ccc; margin:0 auto 15px; background-size:cover;"></div>
            <h2 id="display-user">User</h2>
        </div>
        
        <div style="background:var(--card); margin:15px; border-radius:12px; padding:15px; display:flex; justify-content:space-between; align-items:center;">
            <span>الوضع الليلي (Dark Mode)</span>
            <input type="checkbox" id="theme-toggle" onchange="updateTheme(this.checked)">
        </div>

        <div style="background:var(--card); margin:15px; border-radius:12px;">
            <div style="padding:15px; font-weight:700; font-size:13px; color:gray;">معرض الصور (7 صور)</div>
            <div class="photo-grid" id="settings-grid"></div>
            <input type="file" id="file-picker" multiple accept="image/*" style="display:none;" onchange="processPhotos(event)">
            <button onclick="document.getElementById('file-picker').click()" style="width:100%; padding:15px; background:none; border:none; color:var(--ios-blue); text-align:right;">إضافة صور...</button>
        </div>

        <div style="background:var(--card); margin:15px; border-radius:12px;">
            <textarea id="bio-input" style="width:100%; border:none; padding:15px; background:transparent; color:var(--text); outline:none;" placeholder="اكتب البايو الخاص بك..."></textarea>
        </div>

        <button onclick="saveProfileData()" style="margin:20px 15px 50px; padding:16px; background:var(--ios-blue); color:white; border:none; border-radius:14px; font-weight:800;">حفظ كل التغييرات</button>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODI2MDJ9.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _db = supabase.createClient(supabaseUrl, supabaseKey);

        let myID = localStorage.getItem('app_user_id') || "";
        let peerID = "";
        let gallery = JSON.parse(localStorage.getItem('app_gallery') || "[]");
        let selectedMsgID = null;

        // تطبيق الثيم فوراً عند التحميل
        if(localStorage.getItem('app_theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('theme-toggle').checked = true;
        }

        if(!myID) { myID = prompt("ادخل اسم المستخدم الخاص بك:"); localStorage.setItem('app_user_id', myID); }

        function openScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'settings-screen') {
                document.getElementById('display-user').innerText = myID;
                renderSettingsGrid();
            }
        }

        function updateTheme(isDark) {
            const theme = isDark ? 'dark' : 'light';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
        }

        function renderSettingsGrid() {
            const grid = document.getElementById('settings-grid');
            grid.innerHTML = '';
            for(let i=0; i<7; i++) {
                grid.innerHTML += `<div class="photo-slot">${gallery[i] ? `<img src="${gallery[i]}">` : ''}</div>`;
            }
        }

        function processPhotos(e) {
            const files = Array.from(e.target.files).slice(0, 7);
            gallery = [];
            files.forEach(f => {
                const reader = new FileReader();
                reader.onload = (ev) => { gallery.push(ev.target.result); renderSettingsGrid(); };
                reader.readAsDataURL(f);
            });
        }

        async function saveProfileData() {
            const bio = document.getElementById('bio-input').value;
            localStorage.setItem('app_gallery', JSON.stringify(gallery));
            await _db.from('profiles').upsert([{ username: myID, bio: bio, pfps: gallery }]);
            alert("تم حفظ البروفايل بنجاح!");
            openScreen('home-screen');
        }

        function createNewChat() {
            let p = prompt("يوزر الشخص المراد مراسلته:");
            if(p) { peerID = p; document.getElementById('active-peer').innerText = p; openScreen('chat-screen'); syncMessages(); }
        }

        async function performSend() {
            const input = document.getElementById('m-input');
            if(!input.value) return;
            const text = input.value;
            input.value = '';
            await _db.from('messages').insert([{ sender: myID, receiver: peerID, content: text }]);
            syncMessages();
        }

        async function syncMessages() {
            const { data } = await _db.from('messages').select('*').or(`and(sender.eq.${myID},receiver.eq.${peerID}),and(sender.eq.${peerID},receiver.eq.${myID})`).order('created_at', { ascending: true });
            const flow = document.getElementById('chat-flow');
            flow.innerHTML = '';
            data?.forEach(m => {
                const div = document.createElement('div');
                div.className = `bubble ${m.sender === myID ? 'me' : 'them'}`;
                div.innerText = m.content;
                div.onclick = () => { selectedMsgID = m.id; document.getElementById('delete-sheet').classList.add('open'); document.getElementById('overlay').style.display = 'block'; };
                flow.appendChild(div);
            });
            flow.scrollTop = flow.scrollHeight;
        }

        async function deleteMsg(type) {
            if(type === 'all') {
                await _db.from('messages').delete().eq('id', selectedMsgID);
            }
            closePopups();
            syncMessages();
        }

        function closePopups() {
            document.getElementById('delete-sheet').classList.remove('open');
            document.getElementById('overlay').style.display = 'none';
        }

        setInterval(() => { if(document.getElementById('chat-screen').classList.contains('active')) syncMessages(); }, 3000);
    </script>
</body>
</html>
