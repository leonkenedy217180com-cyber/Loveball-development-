<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatt Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #007aff; --bg: #f2f2f7; --txt: #000; --card: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); overflow: hidden; }

        /* شاشة الدخول المرتبة */
        .login-screen { 
            height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px;
        }
        .login-card { 
            background: rgba(255, 255, 255, 0.95); padding: 40px 30px; border-radius: 30px; 
            width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center;
        }
        .login-card h1 { margin-bottom: 30px; color: #333; font-size: 28px; font-weight: 800; }
        .login-card input { 
            width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; 
            border-radius: 15px; outline: none; font-size: 16px; transition: 0.3s;
        }
        .login-card input:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
        .login-card button { 
            width: 100%; padding: 15px; background: var(--p); color: white; border: none; 
            border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer;
        }

        /* شاشة الدردشة الرئيسية */
        .screen { display: none; height: 100%; flex-direction: column; }
        .active { display: flex; }

        /* الهيدر الجديد */
        .hdr { 
            background: white; padding: 10px 15px; display: flex; align-items: center; 
            border-bottom: 1px solid #e5e5e5; z-index: 10; height: 60px;
        }
        .back-btn { font-size: 24px; cursor: pointer; padding: 5px; color: var(--p); display: flex; align-items: center; }
        .hdr-info { flex: 1; text-align: center; }
        .hdr-info b { display: block; font-size: 17px; color: black; }
        .hdr-info span { font-size: 12px; color: #34c759; }

        /* منطقة الرسائل */
        #chat-area { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; 
            flex-direction: column; gap: 10px; background: #e5ddd5;
        }
        .bubble { 
            max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 15px; 
            position: relative; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .them { align-self: flex-start; background: white; border-bottom-left-radius: 2px; }

        /* صندوق الإرسال الثابت أسفل الشاشة */
        .input-area { 
            background: #f6f6f6; padding: 10px 15px; display: flex; align-items: center; 
            gap: 10px; border-top: 1px solid #ddd; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .input-area input { 
            flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #ddd; 
            outline: none; background: white; font-size: 16px;
        }
        .send-btn { 
            background: var(--p); color: white; border: none; width: 40px; height: 40px; 
            border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center;
        }

        /* قائمة الخيارات (الحذف، التعديل، الرد، التثبيت) */
        .options-menu {
            display: none; position: fixed; bottom: 0; width: 100%; background: white;
            border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.2); z-index: 100;
            padding: 10px 0;
        }
        .opt-item { padding: 15px 20px; font-size: 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; text-align: center; }
        .opt-item:last-child { border: none; color: #ff3b30; }
        .overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.4); z-index: 90; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay" onclick="closeMenu()"></div>

    <div id="menu" class="options-menu">
        <div class="opt-item" onclick="replyMsg()">💬 رد</div>
        <div class="opt-item" onclick="editMsg()">✏️ تعديل</div>
        <div class="opt-item" onclick="pinMsg()">📌 تثبيت</div>
        <div class="opt-item" onclick="delForMe()">🗑️ حذف مني</div>
        <div class="opt-item" style="color:red;" onclick="delForAll()">🗑️ حذف من الجميع</div>
        <div class="opt-item" onclick="closeMenu()" style="background:#eee; font-weight:bold;">إلغاء</div>
    </div>

    <div id="login-scr" class="login-screen">
        <div class="login-card">
            <h1>Chatt</h1>
            <input type="text" id="reg-name" placeholder="الاسم الكامل">
            <input type="text" id="reg-user" placeholder="اسم المستخدم (Username)">
            <button onclick="login()">ابدأ الآن</button>
        </div>
    </div>

    <div id="chat-scr" class="screen">
        <div class="hdr">
            <div class="back-btn" onclick="location.reload()">←</div>
            <div class="hdr-info">
                <b id="friend-name">...</b>
                <span id="status">نشط الآن</span>
            </div>
            <div style="width: 34px;"></div>
        </div>
        
        <div id="chat-area"></div>

        <div class="input-area">
            <input type="text" id="msg-in" placeholder="اكتب رسالة...">
            <button class="send-btn" onclick="send()">➤</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODYwMn0.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _db = supabase.createClient(supabaseUrl, supabaseKey);

        let me = localStorage.getItem('chat_user') || "";
        let f = "Carlos"; // تجريبي كما في الصور
        let selId = null, selTxt = "";

        if(me) startChat();

        function login() {
            const u = document.getElementById('reg-user').value;
            if(u) { localStorage.setItem('chat_user', u); me = u; startChat(); }
        }

        function startChat() {
            document.getElementById('login-scr').style.display = 'none';
            document.getElementById('chat-scr').classList.add('active');
            document.getElementById('friend-name').innerText = f;
            loadMsgs();
            setInterval(loadMsgs, 3000);
        }

        async function loadMsgs() {
            const { data } = await _db.from('messages').select('*').order('created_at', { ascending: true });
            const area = document.getElementById('chat-area');
            area.innerHTML = '';
            data?.forEach(m => {
                const isMe = m.sender === me;
                const div = document.createElement('div');
                div.className = `bubble ${isMe ? 'me' : 'them'}`;
                div.innerText = m.content;
                div.onclick = () => openMenu(m.id, m.content);
                area.appendChild(div);
            });
            area.scrollTop = area.scrollHeight;
        }

        async function send() {
            const i = document.getElementById('msg-in');
            if(!i.value) return;
            await _db.from('messages').insert([{ content: i.value, sender: me, receiver: f }]);
            i.value = '';
            loadMsgs();
        }

        function openMenu(id, txt) {
            selId = id; selTxt = txt;
            document.getElementById('menu').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeMenu() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        // الوظائف المطلوبة
        async function delForAll() { await _db.from('messages').delete().eq('id', selId); closeMenu(); loadMsgs(); }
        function delForMe() { alert("تم الحذف من عندك فقط"); closeMenu(); }
        function replyMsg() { document.getElementById('msg-in').value = `رد على (${selTxt}): `; closeMenu(); }
        function editMsg() { document.getElementById('msg-in').value = selTxt; closeMenu(); }
        function pinMsg() { alert("تم تثبيت الرسالة في الأعلى"); closeMenu(); }
    </script>
</body>
</html>
