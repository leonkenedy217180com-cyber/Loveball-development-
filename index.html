<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chatt Elite Final</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --ios-blue: #007aff; --ios-bg: #f2f2f7; --ios-card: #ffffff; --ios-text: #000; --ios-border: rgba(0,0,0,0.1); }
        [data-theme="dark"] { --ios-bg: #000; --ios-card: #1c1c1e; --ios-text: #fff; --ios-border: rgba(255,255,255,0.1); }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--ios-bg); color: var(--ios-text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; }

        /* الهيدر */
        .ios-hdr { height: 90px; padding: 40px 20px 10px; display: flex; align-items: center; justify-content: space-between; background: var(--ios-card); border-bottom: 0.5px solid var(--ios-border); position: sticky; top: 0; z-index: 100; }
        .ios-hdr h1 { font-size: 32px; font-weight: 800; margin: 0; }

        /* الدائرة الشخصية */
        .pfp-circle { width: 35px; height: 35px; border-radius: 50%; background: #ccc; background-size: cover; background-position: center; cursor: pointer; border: 1px solid var(--ios-border); }

        /* منطقة الرسائل */
        .chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 6px; }
        .bubble { max-width: 75%; padding: 10px 15px; border-radius: 20px; font-size: 16px; line-height: 1.4; position: relative; }
        .me { align-self: flex-end; background: var(--ios-blue); color: white; border-bottom-right-radius: 4px; }
        .them { align-self: flex-start; background: var(--ios-card); color: var(--ios-text); border-bottom-left-radius: 4px; border: 0.5px solid var(--ios-border); }

        /* صندوق الإرسال الثابت */
        .ios-bar { padding: 10px 15px 30px; background: var(--ios-card); border-top: 0.5px solid var(--ios-border); display: flex; align-items: center; gap: 12px; }
        .plus-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--ios-bg); border: none; color: var(--ios-blue); font-size: 22px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .input-box { flex: 1; background: var(--ios-bg); border-radius: 20px; padding: 8px 15px; border: 0.5px solid var(--ios-border); }
        .input-box input { width: 100%; border: none; background: transparent; color: var(--ios-text); outline: none; font-size: 16px; }

        /* الصفحات */
        .full-scr { display: none; position: fixed; inset: 0; background: var(--ios-bg); z-index: 1000; flex-direction: column; }
        .active { display: flex; }

        /* شبكة الصور */
        .pfp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; }
        .slot { aspect-ratio: 1; background: var(--ios-card); border-radius: 10px; border: 1px dashed var(--ios-blue); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
        
        /* أزرار الإعدادات */
        .card { background: var(--ios-card); border-radius: 12px; margin: 10px 15px; border: 0.5px solid var(--ios-border); }
        .row { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid var(--ios-border); }
    </style>
</head>
<body>

    <div id="scr-main" class="full-scr active">
        <div class="ios-hdr">
            <div id="my-pfp-top" class="pfp-circle" onclick="openSettings()"></div>
            <h1>محادثات</h1>
            <button onclick="newChat()" style="background:none; border:none; color:var(--ios-blue); font-size:25px;">⊕</button>
        </div>
        <div id="inbox" style="flex:1; overflow-y:auto; padding:10px;"></div>
    </div>

    <div id="scr-chat" class="full-scr">
        <div class="ios-hdr" style="height:70px; padding-top:20px;">
            <button onclick="closeChat()" style="background:none; border:none; color:var(--ios-blue); font-size:17px;">❮ رجوع</button>
            <b id="chat-title">...</b>
            <div id="friend-pfp" class="pfp-circle"></div>
        </div>
        <div id="chat-flow" class="chat-flow"></div>
        <div class="ios-bar">
            <button class="plus-btn" onclick="document.getElementById('media-up').click()">+</button>
            <input type="file" id="media-up" style="display:none" onchange="uploadMedia(this)">
            <div class="input-box">
                <input type="text" id="msg-input" placeholder="iMessage">
            </div>
            <button onclick="send()" style="background:none; border:none; color:var(--ios-blue); font-weight:700;">إرسال</button>
        </div>
    </div>

    <div id="scr-settings" class="full-scr" style="overflow-y:auto;">
        <div class="ios-hdr" style="height:60px; padding-top:10px;">
            <button onclick="closeSettings()" style="background:none; border:none; color:var(--ios-blue);">تم</button>
            <b>الإعدادات</b>
            <span></span>
        </div>
        
        <div class="card">
            <div class="row">
                <span>الوضع الليلي</span>
                <input type="checkbox" id="dark-toggle" onchange="setTheme(this.checked)">
            </div>
        </div>

        <div class="card">
            <div style="padding:15px; font-size:13px; color:gray;">صور البروفايل (7 صور)</div>
            <div class="pfp-grid" id="pfp-slots"></div>
            <button onclick="document.getElementById('pfp-input').click()" style="width:100%; padding:15px; background:none; border:none; color:var(--ios-blue); text-align:right;">إضافة صور...</button>
            <input type="file" id="pfp-input" multiple accept="image/*" style="display:none;" onchange="handlePfps(this)">
        </div>

        <div class="card">
            <textarea id="bio-input" placeholder="اكتب بايو هنا..." style="width:100%; height:100px; border:none; padding:15px; background:transparent; color:var(--ios-text); outline:none;"></textarea>
        </div>

        <button onclick="saveProfile()" style="margin:20px 15px; padding:15px; background:var(--ios-blue); color:white; border:none; border-radius:12px; font-weight:bold;">حفظ التغييرات</button>
    </div>

    <script>

        if(savedTheme === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('dark-toggle').checked = true;
        }

        if(!me) { me = prompt("ادخل يوزرك مريم:"); localStorage.setItem('u_user', me); }

        function setTheme(isDark) {
            const t = isDark ? 'dark' : 'light';
            document.body.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
        }

        function openSettings() { 
            document.getElementById('scr-settings').classList.add('active'); 
            renderSlots();
        }
        function closeSettings() { document.getElementById('scr-settings').classList.remove('active'); }

        function renderSlots() {
            const container = document.getElementById('pfp-slots');
            container.innerHTML = '';
            for(let i=0; i<7; i++) {
                container.innerHTML += `<div class="slot">${tempPhotos[i] ? `<img src="${tempPhotos[i]}">` : ''}</div>`;
            }
        }

        function handlePfps(input) {
            const files = Array.from(input.files).slice(0, 7);
            tempPhotos = [];
            files.forEach(f => {
                const r = new FileReader();
                r.onload = (e) => { tempPhotos.push(e.target.result); renderSlots(); };
                r.readAsDataURL(f);
            });
        }

        async function saveProfile() {
            const bio = document.getElementById('bio-input').value;
            await _db.from('profiles').upsert([{ username: me, bio: bio, pfps: tempPhotos }]);
            alert("تم الحفظ!");
            closeSettings();
        }

            const u = prompt("اسم الصديق أو الكروب:");

                chatFriend = u;
                document.getElementById('scr-chat').classList.add('active');
                document.getElementById('chat-title').innerText = u;
                loadMsgs();
            }
        }

        function closeChat() { document.getElementById('scr-chat').classList.remove('active'); }

        }
