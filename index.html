<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatt App</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #111827; --card: #1f2937; --accent: #3b82f6; --text: #ffffff; --chat-bg: #111827; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; overflow: hidden; }
        
        .screen { display: none; height: 100vh; flex-direction: column; position: absolute; width: 100%; top: 0; left: 0; transition: 0.3s; }
        .active-screen { display: flex; }

        /* شاشة الدخول */
        #login-screen { justify-content: center; align-items: center; background: var(--bg); }
        .login-box { background: var(--card); padding: 30px; border-radius: 20px; width: 80%; max-width: 350px; text-align: center; }

        /* شاشة القائمة الرئيسية */
        .header { padding: 20px; background: var(--card); font-size: 22px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #374151; }
        .inbox-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 15px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }

        /* شاشة الدردشة */
        #chat-screen { background: var(--chat-bg); }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 75%; }
        .sent { align-self: flex-end; background: var(--accent); }
        .received { align-self: flex-start; background: #374151; }

        /* التحكم والبحث */
        .bottom-nav { padding: 15px; background: var(--card); display: flex; justify-content: space-around; border-top: 1px solid #374151; }
        input { background: #111827; border: 1px solid #374151; padding: 12px; border-radius: 10px; color: white; outline: none; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        .fab { background: var(--accent); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: fixed; bottom: 80px; right: 20px; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        /* الإعدادات */
        #settings-screen { justify-content: center; align-items: center; }
        .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .color-btn { height: 50px; border-radius: 10px; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active-screen">
        <div class="login-box">
            <h2>إنشاء حساب</h2>
            <input type="text" id="reg-name" placeholder="الاسم الشخصي (مثلاً ماري)">
            <input type="text" id="reg-user" placeholder="اليوزر (مثلاً mary99)">
            <button onclick="register()" style="width:100%; background:var(--accent); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold;">ابدأ الآن</button>
        </div>
    </div>

    <div id="inbox-screen" class="screen">
        <div class="header">محادثاتي 💬</div>
        <div id="inbox-list" class="inbox-list">
            <p style="text-align:center; color:#9ca3af; margin-top:50px;">لا توجد محادثات بعد. ابحث عن صديق لبدء الدردشة!</p>
        </div>
        <div class="fab" onclick="showSearch()">🔍</div>
        <div class="bottom-nav">
            <span onclick="showInbox()" style="cursor:pointer">💬</span>
            <span onclick="showSettings()" style="cursor:pointer">⚙️</span>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <div class="header">
            <span onclick="showInbox()" style="cursor:pointer">➔</span>
            <span id="chat-with-name">اسم الصديق</span>
            <span></span>
        </div>
        <div id="chat-box"></div>
        <div style="padding: 15px; background:var(--card); display:flex; gap:10px;">
            <input type="text" id="msg-input" placeholder="اكتب رسالة..." style="margin:0;">
            <button onclick="sendMsg()" style="background:var(--accent); border:none; border-radius:50%; width:45px; color:white;">➤</button>
        </div>
    </div>

    <div id="settings-screen" class="screen">
        <div class="header">
            <span onclick="showInbox()" style="cursor:pointer">➔</span>
            <span>الإعدادات</span>
            <span></span>
        </div>
        <div style="padding:20px; text-align:center;">
            <h3>تغيير خلفية المحادثة</h3>
            <div class="color-grid">
                <div class="color-btn" style="background:#111827" onclick="changeBg('#111827')"></div>
                <div class="color-btn" style="background:#1a2236" onclick="changeBg('#1a2236')"></div>
                <div class="color-btn" style="background:#2d1b2d" onclick="changeBg('#2d1b2d')"></div>
                <div class="color-btn" style="background:#162a16" onclick="changeBg('#162a16')"></div>
                <div class="color-btn" style="background:#2a1616" onclick="changeBg('#2a1616')"></div>
                <div class="color-btn" style="background:#000000" onclick="changeBg('#000000')"></div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://klhcqkjcncujvrzpbwsa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaGNxa2pjbmN1anZyenBid3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODI2MDIsImV4cCI6MjA5MjQ1ODYwMn0.M2mUlbaPsBYaS59zYVfzW42Kga0_w8o2mm3ZFPjOxu8';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let myUser = localStorage.getItem('chatUser') || "";
        let myName = localStorage.getItem('chatName') || "";
        let currentFriend = "";

        if(myUser) showInbox();

        function register() {
            myName = document.getElementById('reg-name').value.trim();
            myUser = document.getElementById('reg-user').value.trim();
            if(myName && myUser) {
                localStorage.setItem('chatUser', myUser);
                localStorage.setItem('chatName', myName);
                showInbox();
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
        }

        function showInbox() { 
            showScreen('inbox-screen'); 
            loadInbox();
        }

        function showSettings() { showScreen('settings-screen'); }

        function showSearch() {
            let friend = prompt("أدخل يوزر الشخص الذي تريد مراسلته:");
            if(friend) startChat(friend);
        }

        function startChat(user) {
            currentFriend = user;
            document.getElementById('chat-with-name').innerText = user;
            showScreen('chat-screen');
            fetchMessages();
        }

        async function fetchMessages() {
            if(document.getElementById('chat-screen').classList.contains('active-screen')) {
                const { data } = await _supabase.from('messages').select('*')
                    .or(`and(sender.eq.${myUser},receiver.eq.${currentFriend}),and(sender.eq.${currentFriend},receiver.eq.${myUser})`)
                    .order('created_at', { ascending: true });
                
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                data?.forEach(m => {
                    const d = document.createElement('div');
                    d.className = 'msg ' + (m.sender === myUser ? 'sent' : 'received');
                    d.textContent = m.content;
                    box.appendChild(d);
                });
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendMsg() {
            const inp = document.getElementById('msg-input');
            if(!inp.value) return;
            await _supabase.from('messages').insert([{ content: inp.value, sender: myUser, receiver: currentFriend }]);
            inp.value = '';
            fetchMessages();
        }

        async function loadInbox() {
            const { data } = await _supabase.from('messages').select('sender, receiver')
                .or(`sender.eq.${myUser},receiver.eq.${myUser}`);
            
            const list = document.getElementById('inbox-list');
            const uniqueUsers = [...new Set(data?.map(m => m.sender === myUser ? m.receiver : m.sender))];
            
            if(uniqueUsers.length > 0) {
                list.innerHTML = '';
                uniqueUsers.forEach(u => {
                    const d = document.createElement('div');
                    d.className = 'chat-item';
                    d.innerHTML = `<div class="avatar">${u[0].toUpperCase()}</div><div><b>${u}</b></div>`;
                    d.onclick = () => startChat(u);
                    list.appendChild(d);
                });
            }
        }

        function changeBg(color) {
            document.documentElement.style.setProperty('--chat-bg', color);
            alert("تم تغيير الخلفية!");
        }

        setInterval(fetchMessages, 3000);
    </script>
</body>
</html>
